name: Integration Tests

on:
  workflow_run:
    workflows: ["Backend CI/CD", "Frontend CI/CD"]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  integration-test-beta:
    name: Integration Tests (Beta)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BETA }}
          aws-region: us-east-1
      
      - name: Install dependencies
        working-directory: tests/integration
        run: npm ci
      
      - name: Run integration tests
        working-directory: tests/integration
        env:
          TEST_API_ENDPOINT: ${{ secrets.BETA_API_ENDPOINT }}
          TEST_FRONTEND_URL: https://beta-dashboard.ai-portfolio.example.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npm test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-beta
          path: tests/integration/results/
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('tests/integration/results/summary.json', 'utf8');
            const summary = JSON.parse(results);
            
            const body = `## Integration Test Results (Beta)
            
            ✅ Passed: ${summary.passed}
            ❌ Failed: ${summary.failed}
            ⏭️ Skipped: ${summary.skipped}
            
            Total: ${summary.total} tests
            Duration: ${summary.duration}ms
            
            [View full results](${summary.reportUrl})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Beta integration tests failed - blocking production deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Beta Integration Tests Failed*\n\nProduction deployment will be blocked until tests pass.\n\nCommit: ${{ github.sha }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
