name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
      
      - name: Run type check
        working-directory: frontend
        run: npm run type-check
      
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --coverage
      
      - name: Build
        working-directory: frontend
        run: npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

  deploy-beta:
    name: Deploy to Beta
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta-dashboard.ai-portfolio.example.com
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BETA }}
          aws-region: us-east-1
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build for Beta
        working-directory: frontend
        env:
          VITE_API_ENDPOINT: ${{ secrets.BETA_API_ENDPOINT }}
          VITE_USER_POOL_ID: ${{ secrets.BETA_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.BETA_USER_POOL_CLIENT_ID }}
          VITE_STAGE: beta
        run: npm run build
      
      - name: Deploy to S3
        working-directory: frontend/dist
        run: |
          aws s3 sync . s3://${{ secrets.BETA_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          
          # Index.html should not be cached
          aws s3 cp index.html s3://${{ secrets.BETA_FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"
      
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.BETA_CLOUDFRONT_DIST_ID }} \
            --paths "/*"
