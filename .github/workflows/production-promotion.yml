name: Production Promotion

on:
  workflow_run:
    workflows: ["Integration Tests"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  check-integration-tests:
    name: Check Integration Test Results
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    
    steps:
      - name: Check test status
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Integration tests passed - proceeding with production deployment"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "❌ Integration tests failed - blocking production deployment"
          fi

  deploy-backend-prod:
    name: Deploy Backend to Production
    needs: check-integration-tests
    if: needs.check-integration-tests.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.ai-portfolio.example.com
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Build Lambda functions
        working-directory: backend
        run: npm run build
      
      - name: CDK Deploy Production
        working-directory: backend/cdk
        run: |
          npm ci
          npx cdk deploy --all \
            --context stage=prod \
            --require-approval never \
            --outputs-file outputs-prod.json
      
      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-prod
          path: backend/cdk/outputs-prod.json
          retention-days: 90
      
      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Backend deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Production Deployment Successful*\n\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-frontend-prod:
    name: Deploy Frontend to Production
    needs: check-integration-tests
    if: needs.check-integration-tests.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dashboard.ai-portfolio.example.com
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build for Production
        working-directory: frontend
        env:
          VITE_API_ENDPOINT: ${{ secrets.PROD_API_ENDPOINT }}
          VITE_USER_POOL_ID: ${{ secrets.PROD_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.PROD_USER_POOL_CLIENT_ID }}
          VITE_STAGE: production
        run: npm run build
      
      - name: Deploy to S3
        working-directory: frontend/dist
        run: |
          aws s3 sync . s3://${{ secrets.PROD_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          
          aws s3 cp index.html s3://${{ secrets.PROD_FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"
      
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_DIST_ID }} \
            --paths "/*"
      
      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Frontend deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend Production Deployment Successful*\n\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nURL: https://dashboard.ai-portfolio.example.com\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  smoke-test-prod:
    name: Production Smoke Tests
    needs: [deploy-backend-prod, deploy-frontend-prod]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        working-directory: tests/integration
        run: npm ci
      
      - name: Run smoke tests
        working-directory: tests/integration
        env:
          TEST_API_ENDPOINT: ${{ secrets.PROD_API_ENDPOINT }}
          TEST_FRONTEND_URL: https://dashboard.ai-portfolio.example.com
          SMOKE_TEST_ONLY: true
        run: npm run test:smoke
      
      - name: Notify smoke test success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production smoke tests passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Smoke Tests Passed*\n\nAll critical paths verified ✅\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Notify smoke test failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 CRITICAL: Production smoke tests failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚨 PRODUCTION SMOKE TESTS FAILED*\n\nImmediate investigation required!\n\nCommit: `${{ github.sha }}`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run & Rollback>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback-on-failure:
    name: Auto-Rollback on Smoke Test Failure
    needs: smoke-test-prod
    if: failure()
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get previous commit
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Checkout previous commit
        run: git checkout HEAD~1
      
      - name: Rollback backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          cd cdk
          npm ci
          npx cdk deploy --all --context stage=prod --require-approval never
      
      - name: Rollback frontend
        working-directory: frontend
        env:
          VITE_API_ENDPOINT: ${{ secrets.PROD_API_ENDPOINT }}
          VITE_USER_POOL_ID: ${{ secrets.PROD_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.PROD_USER_POOL_CLIENT_ID }}
          VITE_STAGE: production
        run: |
          npm ci
          npm run build
          cd dist
          aws s3 sync . s3://${{ secrets.PROD_FRONTEND_BUCKET }} --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_DIST_ID }} \
            --paths "/*"
      
      - name: Notify rollback
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Production rolled back to previous version",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ AUTO-ROLLBACK EXECUTED*\n\nProduction has been rolled back to the previous stable version due to smoke test failures.\n\nFailed commit: `${{ github.sha }}`\nRolled back to: `HEAD~1`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Rollback Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
